name: CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: [ '17', '21' ]
    steps:
      - name: Récupération du code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4.4.0
        with:
          fetch-depth: 0

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3   # v4.9.1
        with:
          java-version: ${{ matrix.java }}
          distribution: temurin
          cache: maven

      - name: Wrapper exécutable
        run: chmod +x mvnw

      - name: Build, tests, couverture et SBOM
        run: ./mvnw -B -P quality clean verify

      - name: Publier les rapports JaCoCo
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02   # v4.6.2
        with:
          name: jacoco-java-${{ matrix.java }}
          path: '**/target/site/jacoco/'

      - name: Publier le SBOM CycloneDX
        if: matrix.java == '21'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02   # v4.6.2
        with:
          name: sbom-cyclonedx
          path: |
            target/classes/META-INF/sbom/application.cdx.json
            target/bom.json
          if-no-files-found: error

      - name: Analyse SonarCloud (Quality Gate bloquant)
        if: matrix.java == '21' && github.actor != 'dependabot[bot]'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: ./mvnw -B -P quality sonar:sonar -Dsonar.qualitygate.wait=true

      - name: Semgrep (SAST bloquant)
        if: matrix.java == '21'
        run: |
          docker run --rm -v "$PWD:/src" -w /src semgrep/semgrep \
            semgrep --config=p/java --config=p/owasp-top-ten --metrics=off \
            --severity=ERROR --error .

      - name: Trivy (dépendances, secrets, configuration) bloquant
        if: matrix.java == '21'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25   # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          skip-dirs: '.git,**/target,spring-petclinic-config-server,spring-petclinic-genai-service,spring-petclinic-admin-server'
          format: table