spring:
  application:
    name: customers-service
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
  sql:
    init:
      schema-locations: classpath*:db/hsqldb/schema.sql
      data-locations: classpath*:db/hsqldb/data.sql

# 0 = port aléatoire en local (découverte via Eureka), surchargeable par SERVER_PORT
server:
  port: ${SERVER_PORT:0}
  shutdown: graceful

eureka:
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${random.uuid}
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}

management:
  endpoints:
    web:
      exposure:
        include: '*'
  metrics:
    export:
      prometheus:
        enabled: true
  tracing:
    sampling:
      probability: 1

---
spring:
  config:
    activate:
      on-profile: docker

server:
  port: 8081

eureka:
  client:
    service-url:
      defaultZone: http://discovery-server:8761/eureka/

management:
  zipkin:
    tracing:
      endpoint: http://tracing-server:9411/api/v2/spans
