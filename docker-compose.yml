# Périmètre du projet : 3 microservices métier (customers, visits, vets)
# + 2 services d'infrastructure (discovery-server = annuaire Eureka, api-gateway = point d'entrée)
# + la pile d'observabilité (Zipkin, Prometheus, Grafana).
#
# Services volontairement désactivés (modules toujours présents sur le disque mais hors du build Maven) :
#   - config-server (8888) : la configuration est désormais embarquée dans chaque application.yml,
#     ce qui supprime la dépendance à un dépôt Git de configuration externe.
#   - genai-service (8084) : dépend d'une clé OPENAI_API_KEY, réponses non déterministes et
#     écritures générées par un LLM ; hors du sujet « communication entre microservices ».
#   - admin-server  (9090) : expose Jolokia (pont JMX distant, vecteur de RCE) et Chaos Monkey.
#
# Pour les réactiver : décommenter le bloc ci-dessous, remettre le module dans <modules> du pom.xml
# racine, restaurer son application.yml (import configserver) et la route /api/genai/** du gateway.
#
# services:
#   config-server:
#     image: springcommunity/spring-petclinic-config-server
#     container_name: config-server
#     healthcheck:
#       test: ["CMD", "curl", "-I", "http://config-server:8888"]
#       interval: 5s
#       timeout: 5s
#       retries: 10
#     ports:
#      - 8888:8888
#
#   genai-service:
#     image: springcommunity/spring-petclinic-genai-service
#     container_name: genai-service
#     environment:
#       - OPENAI_API_KEY=${OPENAI_API_KEY}
#     ports:
#      - 8084:8084
#
#   admin-server:
#     image: springcommunity/spring-petclinic-admin-server
#     container_name: admin-server
#     ports:
#      - 9090:9090

services:
  discovery-server:
    image: springcommunity/spring-petclinic-discovery-server
    container_name: discovery-server
    environment:
      - SPRING_CLOUD_CONFIG_ENABLED=false
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://discovery-server:8761"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
     - 8761:8761

  customers-service:
    image: springcommunity/spring-petclinic-customers-service
    container_name: customers-service
    environment:
      - SPRING_CLOUD_CONFIG_ENABLED=false
    deploy:
      resources:
        limits:
          memory: 512M
    depends_on:
      discovery-server:
        condition: service_healthy
    ports:
    - 8081:8081

  visits-service:
    image: springcommunity/spring-petclinic-visits-service
    container_name: visits-service
    environment:
      - SPRING_CLOUD_CONFIG_ENABLED=false
    deploy:
      resources:
        limits:
          memory: 512M
    depends_on:
      discovery-server:
        condition: service_healthy
    ports:
     - 8082:8082

  vets-service:
    image: springcommunity/spring-petclinic-vets-service
    container_name: vets-service
    environment:
      - SPRING_CLOUD_CONFIG_ENABLED=false
    deploy:
      resources:
        limits:
          memory: 512M
    depends_on:
      discovery-server:
        condition: service_healthy
    ports:
     - 8083:8083

  api-gateway:
    image: springcommunity/spring-petclinic-api-gateway
    container_name: api-gateway
    environment:
      - SPRING_CLOUD_CONFIG_ENABLED=false
    deploy:
      resources:
        limits:
          memory: 512M
    depends_on:
      discovery-server:
        condition: service_healthy
    ports:
     - 8080:8080

  tracing-server:
    image: openzipkin/zipkin
    container_name: tracing-server
    deploy:
      resources:
        limits:
          memory: 512M
    ports:
     - 9411:9411

  ## Grafana / Prometheus

  grafana-server:
    build: ./docker/grafana
    container_name: grafana-server
    deploy:
      resources:
        limits:
          memory: 256M
    ports:
    - 3030:3000

  prometheus-server:
    build: ./docker/prometheus
    container_name: prometheus-server
    deploy:
      resources:
        limits:
          memory: 256M
    ports:
    - 9091:9090
