spring:
  application:
    name: visits-service
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
  sql:
    init:
      schema-locations: classpath*:db/hsqldb/schema.sql
      data-locations: classpath*:db/hsqldb/data.sql

# 0 = port aléatoire en local (découverte via Eureka), surchargeable par SERVER_PORT
server:
  port: ${SERVER_PORT:0}
  shutdown: graceful

eureka:
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${random.uuid}
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://${EUREKA_USER:eureka}:${EUREKA_PASSWORD:eureka-pass}@localhost:8761/eureka/}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
  metrics:
    export:
      prometheus:
        enabled: true
  tracing:
    sampling:
      probability: 1

---
spring:
  config:
    activate:
      on-profile: docker

server:
  port: 8082

eureka:
  client:
    service-url:
      defaultZone: http://${EUREKA_USER:eureka}:${EUREKA_PASSWORD:eureka-pass}@discovery-server:8761/eureka/

management:
  zipkin:
    tracing:
      endpoint: http://tracing-server:9411/api/v2/spans



---
spring:
  config:
    activate:
      on-profile: tls

server:
  port: ${SERVER_PORT:8082}
  ssl:
    enabled: true
    key-store: file:${PKI_DIR:secrets}/visits.p12
    key-store-type: PKCS12
    key-store-password: ${PKI_PASS}
    key-alias: visits
    client-auth: want
    trust-store: file:${PKI_DIR:secrets}/truststore.p12
    trust-store-type: PKCS12
    trust-store-password: ${PKI_PASS}

management:
  server:
    port: ${MANAGEMENT_PORT:8092}

eureka:
  instance:
    hostname: ${EUREKA_INSTANCE_HOSTNAME:localhost}
    prefer-ip-address: false
    secure-port-enabled: true
    non-secure-port-enabled: false
    secure-port: ${SERVER_PORT:8082}
